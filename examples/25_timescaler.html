<!doctype html>
<html lang="en">
	<head>
		<title>Tween.js / timescaler</title>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<link href="css/style.css" media="screen" rel="stylesheet" type="text/css" />
		<script type="importmap">
			{
				"imports": {
					"@tweenjs/tween.js": "../dist/tween.esm.js"
				}
			}
		</script>
	</head>
	<body>
		<div id="info">
			<h1><a href="http://github.com/tweenjs/tween.js">tween.js</a></h1>
			<h2>25 _ timescaler</h2>
			<p>
				Decoupled time scaling: a <code>TimeScaler</code> maps the source clock to tween time. No
				<code>tween.timeScale</code> needed.
			</p>
			<p><input id="scale" type="range" min="0" max="2" step="0.1" value="1" /> <span id="scaleValue">1x</span></p>
			<p><button id="ramp">Animate scale from 0 to 1</button></p>
		</div>
		<div style="position: absolute; top: 100px; left: 400px">
			<div id="target" data-x="0" class="box">1x</div>
		</div>

		<script type="module">
			import {Easing, TimeScaler, Tween} from '@tweenjs/tween.js'

			const target = document.getElementById('target')
			const slider = document.getElementById('scale')
			const scaleValue = document.getElementById('scaleValue')
			const scaler = new TimeScaler(1)
			const scaleTween = new Tween(scaler).to({scale: 1}, 4000)

			const tween = new Tween(target.dataset)
				.to({x: 400}, 2000)
				.easing(Easing.Quadratic.InOut)
				.onUpdate(function () {
					updateBox(target, target.dataset)
				})

			slider.addEventListener('input', function () {
				scaler.update(performance.now())
				scaleTween.stop()
				const v = parseFloat(this.value)
				scaler.scale = v
				scaleValue.textContent = v.toFixed(1) + 'x'
				target.textContent = v.toFixed(1) + 'x'
			})

			document.getElementById('ramp').addEventListener('click', function () {
				const time = performance.now()
				scaler.update(time)
				scaleTween.stop()
				scaler.scale = 0
				scaleTween.start(time, true)
			})

			const startTime = performance.now()
			scaler.start(startTime)
			tween.start(startTime)
			requestAnimationFrame(animate)

			function animate(time) {
				requestAnimationFrame(animate)
				const scaled = scaler.update(time)
				// Loop forever so the scale effect is always visible (same
				// pattern as 22_timeline_repeat).
				if (tween.update(scaled) === false) {
					target.dataset.x = 0
					tween.start(scaled)
				}
				if (scaleTween.isPlaying()) {
					scaleTween.update(time)
					slider.value = scaler.scale
					scaleValue.textContent = scaler.scale.toFixed(1) + 'x'
					target.textContent = scaler.scale.toFixed(1) + 'x'
				}
			}

			function updateBox(box, params) {
				const s = box.style,
					transform = 'translateX(' + Math.floor(params.x) + 'px)'
				s.webkitTransform = transform
				s.mozTransform = transform
				s.transform = transform
			}
		</script>

		<style type="text/css">
			.box {
				width: 100px;
				height: 100px;
				margin: 10px;
				padding: 10px;
				display: inline-block;
				float: left;
				background: #fcc;
			}
		</style>
	</body>
</html>
