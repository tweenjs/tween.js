<!doctype html>
<html lang="en">
	<head>
		<title>Tween.js / timeline repeat</title>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<link href="css/style.css" media="screen" rel="stylesheet" type="text/css" />
		<script type="importmap">
			{
				"imports": {
					"@tweenjs/tween.js": "../dist/tween.esm.js"
				}
			}
		</script>
	</head>
	<body>
		<div id="info">
			<h1><a href="http://github.com/tweenjs/tween.js">tween.js</a></h1>
			<h2>22 _ timeline repeat</h2>
			<p>Repeats and yoyos via Timeline: no <code>repeat()</code> or <code>yoyo()</code> needed.</p>
		</div>
		<div style="position: absolute; top: 100px; left: 400px">
			<div id="target1" data-x="0" class="box">repeat x3</div>
			<div id="target2" data-x="0" class="box">yoyo</div>
			<div id="target3" data-x="0" class="box">yoyo x2</div>
		</div>

		<script type="module">
			import {Easing, Timeline, Tween} from '@tweenjs/tween.js'

			const timelines = []

			init()
			animate()

			function init() {
				// 1. Repeat: plays three times (each extra play clones the tween).
				const target1 = document.getElementById('target1')
				const repeat = new Timeline()
					.add(new Tween(target1.dataset).to({x: 200}, 600).easing(Easing.Quadratic.InOut), {repeat: 3})
					.onUpdate(function () {
						updateBox(target1, target1.dataset)
					})
				repeat.start()
				timelines.push(repeat)

				// 2. Yoyo: forward, then back via a reversed clip.
				const target2 = document.getElementById('target2')
				const yoyo = new Timeline()
					.add(new Tween(target2.dataset).to({x: 200}, 600).easing(Easing.Quadratic.InOut), {yoyo: true})
					.onUpdate(function () {
						updateBox(target2, target2.dataset)
					})
				yoyo.start()
				timelines.push(yoyo)

				// 3. Yoyo + repeat: forward, back, forward, back.
				const target3 = document.getElementById('target3')
				const yoyoRepeat = new Timeline()
					.add(new Tween(target3.dataset).to({x: 200}, 600).easing(Easing.Quadratic.InOut), {
						yoyo: true,
						repeat: 2,
					})
					.onUpdate(function () {
						updateBox(target3, target3.dataset)
					})
				yoyoRepeat.start()
				timelines.push(yoyoRepeat)
			}

			function animate(time) {
				requestAnimationFrame(animate)

				for (let i = 0; i < timelines.length; i++) {
					if (timelines[i].update(time) === false) timelines[i].start(time)
				}
			}

			function updateBox(box, params) {
				const s = box.style,
					transform = 'translateX(' + Math.floor(params.x) + 'px)'
				s.webkitTransform = transform
				s.mozTransform = transform
				s.transform = transform
			}
		</script>

		<style type="text/css">
			.box {
				width: 100px;
				height: 100px;
				margin: 10px;
				padding: 10px;
				display: inline-block;
				float: left;
			}
			#target1 {
				background: #fcc;
			}
			#target2 {
				background: #cfc;
			}
			#target3 {
				background: #ccf;
			}
		</style>
	</body>
</html>
