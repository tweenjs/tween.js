<!doctype html>
<html lang="en">
	<head>
		<title>Tween.js / timeline slider</title>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<link href="css/style.css" media="screen" rel="stylesheet" type="text/css" />
		<!-- UMD build (not a module) so this page also works via file:// -->
		<script src="../dist/tween.umd.js"></script>
	</head>
	<body id="page">
		<div id="info">
			<h1><a href="http://github.com/tweenjs/tween.js">tween.js</a></h1>
			<h2>21 _ timeline slider</h2>
			<p>One timeline, 8 tweens, scrubbed manually with the slider below.</p>
		</div>
		<div style="position: absolute; top: 140px; left: 400px">
			<div id="target" class="box">scrub me</div>
			<div id="steps"></div>
		</div>
		<div id="scrubber">
			<input id="slider" type="range" min="0" max="100" step="1" value="0" />
			<span id="readout">0ms</span>
		</div>

		<script>
			if (!window.TWEEN || typeof TWEEN.Timeline !== 'function') {
				document.getElementById('info').innerHTML +=
					'<p style="color:red">TWEEN.Timeline not found in ../dist/. Run `npm run build` first, then reload.</p>'
				throw new Error('TWEEN.Timeline missing: rebuild dist with `npm run build`')
			}

			var Tween = TWEEN.Tween
			var Timeline = TWEEN.Timeline
			var Easing = TWEEN.Easing

			// One shared state object; each tween owns different properties.
			// Colors are tweened as r/g/b numbers, then composed into CSS.
			var state = {
				x: 0,
				y: 0,
				r: 255,
				g: 204,
				b: 204,
				size: 100,
				radius: 0,
				rotation: 0,
				opacity: 1,
				pr: 255,
				pg: 255,
				pb: 255,
			}

			var STEP = 800
			var labels = ['move', 'color', 'grow', 'round', 'spin', 'fade', 'drop', 'page']

			var tl = new Timeline()
				.add(new Tween(state).to({x: 260}, STEP).easing(Easing.Quadratic.InOut))
				.add(new Tween(state).to({r: 108, g: 204, b: 255}, STEP).easing(Easing.Linear.None))
				.add(new Tween(state).to({size: 160}, STEP).easing(Easing.Quadratic.InOut))
				.add(new Tween(state).to({radius: 50}, STEP).easing(Easing.Quadratic.InOut))
				.add(new Tween(state).to({rotation: 180}, STEP).easing(Easing.Sinusoidal.InOut))
				.add(new Tween(state).to({opacity: 0.35}, STEP).easing(Easing.Linear.None))
				.add(new Tween(state).to({y: 120}, STEP).easing(Easing.Quadratic.InOut))
				.add(new Tween(state).to({pr: 40, pg: 44, pb: 52}, STEP).easing(Easing.Linear.None))
				.onUpdate(render)

			var slider = document.getElementById('slider')
			var readout = document.getElementById('readout')
			var stepsEl = document.getElementById('steps')
			slider.max = tl.getDuration()

			labels.forEach(function (name, i) {
				var dot = document.createElement('span')
				dot.className = 'step'
				dot.textContent = i + 1
				dot.title = name + ' (' + i * STEP + 'ms)'
				stepsEl.appendChild(dot)
			})

			slider.addEventListener('input', function () {
				// Manual update: (re)start at local 0 when finished, then drive to v.
				var v = +slider.value
				if (!tl.isPlaying()) tl.start(0)
				tl.update(v)
				render()
			})

			tl.start(0)
			tl.update(0)
			render()

			function render() {
				var t = +slider.value
				updateBox(state)
				readout.textContent = t + 'ms · ' + labels[Math.min(labels.length - 1, Math.floor(t / STEP))]
				var dots = stepsEl.children
				var active = Math.min(dots.length - 1, Math.floor(t / STEP))
				for (var i = 0; i < dots.length; i++) {
					dots[i].className = 'step' + (i === active ? ' active' : '')
				}
			}

			function updateBox(s) {
				var box = document.getElementById('target')
				var st = box.style
				st.width = Math.round(s.size) + 'px'
				st.height = Math.round(s.size) + 'px'
				st.background = 'rgb(' + Math.round(s.r) + ',' + Math.round(s.g) + ',' + Math.round(s.b) + ')'
				st.borderRadius = Math.round(s.radius) + '%'
				st.opacity = s.opacity
				st.transform =
					'translate(' + Math.round(s.x) + 'px,' + Math.round(s.y) + 'px) rotate(' + Math.round(s.rotation) + 'deg)'
				document.getElementById('page').style.background =
					'rgb(' + Math.round(s.pr) + ',' + Math.round(s.pg) + ',' + Math.round(s.pb) + ')'
			}
		</script>

		<style type="text/css">
			.box {
				width: 100px;
				height: 100px;
				margin: 10px;
				padding: 10px;
				display: inline-block;
				float: left;
				background: #fcc;
			}
			#steps {
				clear: both;
				padding-top: 8px;
			}
			.step {
				display: inline-block;
				width: 22px;
				height: 22px;
				line-height: 22px;
				text-align: center;
				margin-right: 6px;
				border-radius: 50%;
				background: #ddd;
				color: #555;
				font-size: 12px;
			}
			.step.active {
				background: #333;
				color: #fff;
			}
			#scrubber {
				position: fixed;
				left: 0;
				right: 0;
				bottom: 0;
				padding: 12px 20px;
				background: rgba(255, 255, 255, 0.9);
				border-top: 1px solid #ccc;
				display: flex;
				align-items: center;
				gap: 12px;
			}
			#slider {
				flex: 1;
			}
			#readout {
				min-width: 140px;
				font-family: monospace;
			}
		</style>
	</body>
</html>
