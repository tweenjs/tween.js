<!doctype html>
<html lang="en">
	<head>
		<title>Tween.js / timeline</title>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<link href="css/style.css" media="screen" rel="stylesheet" type="text/css" />
	</head>
	<body>
		<div id="info">
			<h1><a href="http://github.com/tweenjs/tween.js">tween.js</a></h1>
			<h2>20 _ timeline</h2>
			<p>Sequencing with Timeline: sequential by default, parallel via offsets and labels.</p>
		</div>
		<div style="position: absolute; top: 100px; left: 400px">
			<div id="target1" data-x="0" class="box">sequential</div>
			<div id="target2" data-x="0" class="box">parallel</div>
			<div id="target3" data-x="0" class="box">labels + yoyo</div>
		</div>

		<script type="module">
			import {Tween, Timeline, Easing} from '../dist/tween.esm.js'

			const timelines = []

			init()
			animate()

			function init() {
				// 1. Sequential: add() appends after the last child (replaces chain).
				const target1 = document.getElementById('target1')
				const seq = new Timeline()
					.add(new Tween(target1.dataset).to({x: 200}, 800).easing(Easing.Quadratic.InOut))
					.add(new Tween(target1.dataset).to({x: 0}, 800).easing(Easing.Quadratic.InOut))
					.repeat(Infinity)
					.onUpdate(() => updateBox(target1, target1.dataset))
				seq.start()
				timelines.push(seq)

				// 2. Parallel: explicit offset 0 starts children together.
				const target2 = document.getElementById('target2')
				const par = new Timeline()
					.add(new Tween(target2.dataset).to({x: 200}, 1000).easing(Easing.Sinusoidal.InOut), 0)
					.add(new Tween({dummy: 0}).to({dummy: 1}, 1000), 0)
					.onUpdate(() => updateBox(target2, target2.dataset))
				par.repeat(Infinity).yoyo(true)
				par.start()
				timelines.push(par)

				// 3. Labels and nesting: an inner timeline inside an outer one.
				const target3 = document.getElementById('target3')
				const inner = new Timeline()
					.add(new Tween(target3.dataset).to({x: 200}, 600), 0)
					.addLabel('mid', 300)
					.add(new Tween(target3.dataset).to({x: 0}, 600), 'mid+=150')

				const outer = new Timeline()
					.add(inner, 0)
					.repeat(Infinity)
					.yoyo(true)
					.onUpdate(() => updateBox(target3, target3.dataset))
				outer.start()
				timelines.push(outer)
			}

			function animate(time) {
				requestAnimationFrame(animate)

				for (const tl of timelines) tl.update(time)
			}

			function updateBox(box, params) {
				const s = box.style,
					transform = 'translateX(' + Math.floor(params.x) + 'px)'
				s.webkitTransform = transform
				s.mozTransform = transform
				s.transform = transform
			}
		</script>

		<style type="text/css">
			.box {
				width: 100px;
				height: 100px;
				margin: 10px;
				padding: 10px;
				display: inline-block;
				float: left;
			}
			#target1 {
				background: #fcc;
			}
			#target2 {
				background: #cfc;
			}
			#target3 {
				background: #ccf;
			}
		</style>
	</body>
</html>
