<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>tween.js — Timeline GUI</title>
		<link rel="stylesheet" href="./src/styles.css" />
		<script type="importmap">
			{
				"imports": {
					"@tweenjs/tween.js": "../dist/tween.esm.js"
				}
			}
		</script>
	</head>
	<body>
		<header class="top">
			<h1>Timeline GUI <span>for tween.js</span></h1>
			<button id="btn-play" title="Play">▶</button>
			<button id="btn-pause" title="Pause">⏸</button>
			<button id="btn-stop" title="Stop">⏹</button>
			<button id="btn-loop" title="Toggle loop">🔁</button>
			<select id="sel-speed" title="Playback speed">
				<option value="0.25">0.25×</option>
				<option value="0.5">0.5×</option>
				<option value="1" selected>1×</option>
				<option value="2">2×</option>
			</select>
			<select id="sel-zoom" title="Zoom">
				<option value="0.03">Zoom out</option>
				<option value="0.06">Zoom −</option>
				<option value="0.1" selected>Zoom 1×</option>
				<option value="0.2">Zoom +</option>
				<option value="0.4">Zoom ++</option>
			</select>
			<span id="readout">0ms / 0ms</span>
		</header>

		<main>
			<div>
				<section class="stage-wrap">
					<div id="stage"><div id="box">box</div></div>
					<div id="state-readout"></div>
				</section>

				<section class="tl-wrap">
					<div class="toolbar">
						<button id="btn-add">+ tween</button>
						<button id="btn-add-nested">+ nested</button>
						<button id="btn-add-label">+ label</button>
						<button id="btn-dup">Duplicate</button>
						<button id="btn-del">Delete</button>
						<span class="spacer"></span>
						<button id="btn-reset">Reset demo</button>
					</div>
					<div class="tl-scroll" id="tl-scroll">
						<div id="ruler" title="Click or drag to scrub"></div>
						<div id="tracks"></div>
						<div id="playhead"></div>
					</div>
					<div id="scrubber">
						<input id="slider" type="range" min="0" max="1000" step="1" value="0" />
					</div>
					<p class="hint">
						Drag clips to move them · drag the right edge to resize · drag the ruler or slider to scrub (explicit clock,
						cf. <code>examples/21_timeline_slider.html</code>).
					</p>
				</section>

				<section class="code">
					<div class="toolbar">
						<strong>Export</strong>
						<span class="spacer"></span>
						<button id="btn-copy-js">Copy JS</button>
						<button id="btn-copy-json">Copy JSON</button>
						<button id="btn-load-json">Load JSON ↓</button>
					</div>
					<pre id="code-out"></pre>
					<div class="field">
						<label for="json-in">Model JSON (paste to import, then “Load JSON”)</label>
						<textarea id="json-in" rows="6" spellcheck="false"></textarea>
					</div>
				</section>
			</div>

			<aside class="inspector">
				<h2>Inspector</h2>
				<div id="inspector-body"></div>
			</aside>
		</main>

		<script type="module" src="./src/app.js"></script>
	</body>
</html>
